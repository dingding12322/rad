name: Bug report
description: Something in Orbit is broken or behaves unexpectedly.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search
        [existing issues](https://github.com/imrj05/orbit/issues) first.

        For security vulnerabilities, do **not** use this form — see
        [SECURITY.md](https://github.com/imrj05/orbit/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal, ordered steps so we can reproduce it.
      placeholder: |
        1. Open Orbit with workspace …
        2. Send the prompt …
        3. Click …
        4. See …
    validations:
      required: true

  - type: input
    id: orbit-version
    attributes:
      label: Orbit version
      description: A release tag, commit SHA, or "main".
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How did you install Orbit?
      options:
        - Built from source (cargo run)
        - DMG / .app bundle
        - Other
    validations:
      required: true

  - type: input
    id: pi-version
    attributes:
      label: pi CLI version
      description: Output of `pi --version`.
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version and architecture
      placeholder: "macOS 15.2 (Apple Silicon)"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / terminal output
      description: Paste any relevant output. This is rendered as code, no backticks needed.
      render: shell
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: For visual bugs, drag images here.
    validations:
      required: false
