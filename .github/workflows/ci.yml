# rad 自己的 CI：只验证这个仓库改动的正确性，不涉及任何上游流程。
# Orbit 的 Rust 测试较重（首次装工具链约 +1min，有缓存后很快），与 npm check 并行跑。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check

  orbit:
    name: orbit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: platform/orbit
      - run: cargo test -p orbit-pi --release
        working-directory: platform/orbit
